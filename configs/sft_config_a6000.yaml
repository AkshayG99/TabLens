### Model
model_name_or_path: unsloth/Qwen3.5-9B

### Method
stage: sft
do_train: true
finetuning_type: lora
# Fast kernels (this branch): flash-attn (fa2) speeds up the 8 dense-attention
# layers, liger-kernel fuses loss/norm/rope for lower memory + higher throughput.
# Install via scripts/run_sft_a6000.sh before training. If install fails, set
# both back to disabled and use the merged main config instead.
flash_attn: fa2
enable_liger_kernel: true

### Quantization
quantization_bit: 4
quantization_method: bitsandbytes

### LoRA
lora_rank: 16
lora_alpha: 32
lora_target: all

### Dataset
dataset_dir: data/cot_datasets
# Train ONLY on the train split. german_v2_cot.jsonl (all 1000 rows) leaked
# val+test into training — build per-split files with data/build_cot_splits.py
# first (it also moves the verdict to the start of each target).
dataset: german_v2_cot_train
eval_dataset: german_v2_cot_val
# qwen3_nothink matches eval's apply_chat_template(..., enable_thinking=False);
# template "qwen" inserted the default Qwen system prompt and mismatched training/inference.
template: qwen3_nothink
# Max real sequence is 1251 tokens, so 1536 is safe headroom.
cutoff_len: 1536
max_samples: 100000
overwrite_cache: true
# Packing concatenates samples into full 1536-token rows (no padding waste).
# Safe with liger's fused cross-entropy; drop to false if you want per-sample
# alignment or if eval behaves unexpectedly.
packing: true

### Training
learning_rate: 2.0e-5
num_train_epochs: 6
# Optimized variant: flash-attn + liger fuse the loss tensor, so 48GB easily
# holds batch 8 x grad-accum 1 (effective batch 8, same as main) at ~8x the
# wall-clock speed of the batch-1 12GB config.
per_device_train_batch_size: 8
per_device_eval_batch_size: 4
gradient_checkpointing: true
optim: paged_adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### Evaluation & checkpoint selection
eval_strategy: steps
eval_steps: 50
eval_delay: 50
metric_for_best_model: eval_loss
greater_is_better: false
load_best_model_at_end: true
early_stopping_steps: 100
plot_loss: true

### Output
output_dir: outputs/qwen3.5-9b-sft-a6000
overwrite_output_dir: true
logging_steps: 10
save_steps: 50
save_total_limit: 3
