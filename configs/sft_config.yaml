### Model
model_name_or_path: unsloth/Qwen3.5-9B

### Method
stage: sft
do_train: true
finetuning_type: lora

### Quantization
quantization_bit: 4
quantization_method: bitsandbytes

### Kernel optimizations (Triton)
# Liger fuses RoPE/MLP/RMSNorm + the cross-entropy loss, which removes the
# batch*seq*vocab loss tensor that previously blew up at batch 2. FA3 is a
# Triton FlashAttention kernel. Requires `pip install -r
# LLaMA-Factory/requirements/liger-kernel.txt` and `flash-attn>=2.7`.
enable_liger_kernel: true
flash_attn: fa3

### LoRA
lora_rank: 16
lora_alpha: 32
lora_target: all

### Dataset
dataset_dir: data/cot_datasets
# Train ONLY on the train split. german_v2_cot.jsonl (all 1000 rows) leaked
# val+test into training — build per-split files with data/build_cot_splits.py
# first (it also moves the verdict to the start of each target).
dataset: german_v2_cot_train
eval_dataset: german_v2_cot_val
# qwen3_nothink matches eval's apply_chat_template(..., enable_thinking=False);
# template "qwen" inserted the default Qwen system prompt and mismatched training/inference.
template: qwen3_nothink
# Max real sequence is 1251 tokens, so 1536 is safe headroom on 12GB VRAM.
cutoff_len: 1536
max_samples: 100000
overwrite_cache: true
# Pack short sequences together so the 1536 cutoff isn't wasted on padding
# (avg sample is ~1251 tokens). Reduces effective tokens per step ~20%.
packing: true

### Training
learning_rate: 2.0e-5
num_train_epochs: 6
# Batch 2 is safe now that liger fuses the cross-entropy loss (which was the
# OOM culprit at batch*seq*vocab); grad-accum 4 keeps effective batch at 8.
per_device_train_batch_size: 2
per_device_eval_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
# paged_adamw_8bit offloads optimizer states to CPU when idle — big VRAM
# saving on 12GB GPUs (RTX 4070).
optim: paged_adamw_8bit
lr_scheduler_type: cosine
warmup_ratio: 0.1
# bf16 is faster than fp16 on Ada/Ampere GPUs and plays better with 4-bit QLoRA.
bf16: true
ddp_timeout: 180000000

### Evaluation & checkpoint selection
eval_strategy: steps
eval_steps: 50
eval_delay: 50
metric_for_best_model: eval_loss
greater_is_better: false
load_best_model_at_end: true
early_stopping_steps: 100
plot_loss: true

### Output
output_dir: outputs/qwen3.5-9b-sft
overwrite_output_dir: true
logging_steps: 10
save_steps: 50
save_total_limit: 3
